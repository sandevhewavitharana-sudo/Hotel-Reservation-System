spring.application.name=hotel-booking-system

# --- Database connection ---
# Update the username/password to match your local MySQL install.
# The database itself (hotel_booking_db) is created by database/schema.sql.
spring.datasource.url=jdbc:mysql://localhost:3306/hotel_booking_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# 'update' lets Hibernate create/adjust tables from the entity classes on
# startup, which is convenient while developing. Switch to 'validate' once
# your schema is stable and you're managing migrations yourself.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Server ---
server.port=8080
